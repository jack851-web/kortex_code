# ============================================================
#  实机模式配置 (纯实机，无仿真同步)
#  - object_position 和 plate_position 支持：
#    1. 具体坐标：[x, y, z]
#    2. "random"：随机生成位置（在工作空间范围内）
# ============================================================

robot:
  ip: "192.168.1.10"
  connect_timeout: 5.0
  # 初始关节角度（度），任务完成后回到此位置
  initial_joints: [260.44, 51.32, 315.13, 86.87, 284.12, 85.93]
  initial_gripper: 0.0

# 工作空间约束（用于random位置生成）
workspace:
  base_position: [0.0, 0.0, 0.0]
  # 三轴坐标范围 [min, max]，单位 米
  # X 轴：机械臂前方，数值越大越远
  # Y 轴：机械臂左右，正值=左，负值=右（从机械臂视角）
  # Z 轴：桌面高度范围
  x_range: [0, 0.55]
  y_range: [0, 0.55]
  z_range: [0.05, 0.6]
  safety_margin: 0.05
  min_object_plate_distance: 0.15

cameras:
  real:
    hand:
      type: "opencv"
      index: 0
      width: 640
      height: 480
      fps: 30

grasp:
  micro_lift_height: 0.02             # 放置时松开前微抬
  release_lift_height: 0.08           # 放置后抬升
  object_profiles:
    default:
      pre_grasp_height: 0.05          # 预抓取高度（物体上方，米）
      lift_height: 0.1                # 抓取后抬升高度
      gripper_open: 0.0               # 夹爪张开
      gripper_close: 0.65             # 夹爪闭合
    cup:
      pre_grasp_height: 0.01
      lift_height: 0.1
      gripper_open: 0.80
      gripper_close: 0.80
    mug:
      pre_grasp_height: 0.08
      lift_height: 0.1
      gripper_open: 0.3
      gripper_close: 0.5
    apple:
      pre_grasp_height: 0.08
      lift_height: 0.1
      gripper_open: 0.1
      gripper_close: 0.1

dataset:
  real_data_root: "data/Real/realdata"
  fps: 30

tasks:
  task1:
    object_name: "apple"
    object_position: [0.07, 0.4, 0.00]
    plate_position: [0.358, 0.329, 0.02]
    description: "grasp mug and place to right side"
  task2:
    object_name: "apple"
    object_position: [0.07, 0.4, 0.01]
    plate_position: [0.358, 0.329, 0.02]
    description: "grasp mug and place to right side"
 