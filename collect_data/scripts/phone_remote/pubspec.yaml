name: phone_remote
description: Kortex Robot Teleoperation Control App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ARCore（通过原生Android SDK集成，不再使用augen插件）
  # augen已被移除，ARCore由MainActivity.kt直接管理

  # WebSocket通信
  web_socket_channel: ^3.0.0
  connectivity_plus: ^6.0.0

  # 音效播放
  audioplayers: ^6.0.0

  # 状态管理
  flutter_riverpod: ^2.5.0

  # 本地存储
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # SVG图标（手绘SVG，禁止emoji）
  flutter_svg: ^2.0.9

  # 工具库
  vector_math: ^2.1.4
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/icons/
